services:
  database:
    build: 
      context: ./backend/database
    ports:
      - "8011:8011"
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
    restart: always

  sentiment:
    build:
      context: ./backend/sentiment
    ports:
      - "8012:8012"
    environment:
      - ENV=production
    restart: always

  bias_engine:
    build:
      context: ./backend/political_bias
    ports:
      - "9000:9000"
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
    volumes:
      - bias_model_cache:/app/bias_model
  emotion:
    build:
      context: ./backend/emotion
    ports:
      - "8013:8013"
    environment:
      - ENV=production
    restart: always

  propaganda:
    build:
      context: ./backend/propaganda
    ports:
      - "8014:8014"
    environment:
      - ENV=production
    restart: always
    
  factcheck:
    build:
      context: ./backend/fact-check
    ports:
      - "8016:8016"
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
    restart: always

  analyzer:
    build: 
      context: ./backend/analyzer
    ports:
      - "8017:8017"
    environment:
      - ENV=production
      - SCRAPER_DATA_DIR=/app/data
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    restart: always

  scraper:
    build:
      context: ./backend/scraper
    ports:
      - "8015:8015"
    environment:
      - ENV=production
    env_file:
      - ./backend/.env
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  application:
    build:
      context: ./application
    ports:
      - "8010:8010"
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
      - SCRAPER_DATA_DIR=/app/data
      - DATABASE_URL=http://database:8011
      - SENTIMENT_URL=http://sentiment:8012
      - EMOTION_URL=http://emotion:8013
      - PROPAGANDA_URL=http://propaganda:8014
      - SCRAPER_URL=http://scraper:8015
      - FACTCHECK_URL=http://factcheck:8016
      - ANALYZER_URL=http://analyzer:8017
      - BIAS_URL=http://bias_engine:9000
      - REDIS_URL=redis://redis:6379
    restart: always

  webapp:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    restart: always

  telebot:
    build:
      context: ./telebot
    ports:
      - "8020:8020"
    env_file:
      - .env
    environment:
      - ENV=production
      - APPLICATION_URL=http://application:8010
      - WEB_APP_URL=http://webapp:5173
    restart: always

volumes:
  bias_model_cache:
  redis_data:

