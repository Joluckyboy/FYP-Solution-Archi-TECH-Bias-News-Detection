name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - path: backend/database
            name: database
          - path: backend/fact-check
            name: fact-check
          - path: backend/sentiment
            name: sentiment
          - path: backend/emotion
            name: emotion
          - path: backend/propaganda
            name: propaganda
          - path: backend/scraper
            name: scraper
          - path: application
            name: application

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service.path }}/requirements.txt

      - name: Install dependencies for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-mock

      - name: Run tests for ${{ matrix.service.name }}
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ matrix.service.path }}
          API_KEY: ${{ secrets.API_KEY }}
          API_KEYDS: ${{ secrets.API_KEYDS }}
          MODEL: ${{ secrets.MODEL }}
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
          else
            echo "No tests directory found for ${{ matrix.service.name }}"
          fi

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: database
            context: ./backend/database
          - name: sentiment
            context: ./backend/sentiment
          - name: emotion
            context: ./backend/emotion
          - name: propaganda
            context: ./backend/propaganda
          - name: factcheck
            context: ./backend/fact-check
          - name: scraper
            context: ./backend/scraper
          - name: application
            context: ./application
          - name: telebot
            context: ./telebot

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: ${{ matrix.service.name }}:test
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
