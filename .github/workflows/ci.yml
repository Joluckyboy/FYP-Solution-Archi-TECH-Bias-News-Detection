name: Continuous Integration

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      sentiment: ${{ steps.filter.outputs.sentiment }}
      emotion: ${{ steps.filter.outputs.emotion }}
      propaganda: ${{ steps.filter.outputs.propaganda }}
      database: ${{ steps.filter.outputs.database }}
      factcheck: ${{ steps.filter.outputs.factcheck }}
      scraper: ${{ steps.filter.outputs.scraper }}
      analyzer: ${{ steps.filter.outputs.analyzer }}
      political_bias: ${{ steps.filter.outputs.political_bias }}
      bias_classifier_task: ${{ steps.filter.outputs.bias_classifier_task }}
      application: ${{ steps.filter.outputs.application }}
      telebot: ${{ steps.filter.outputs.telebot }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'application/**'
              - 'telebot/**'
            sentiment:
              - 'backend/sentiment/**'
            emotion:
              - 'backend/emotion/**'
            propaganda:
              - 'backend/propaganda/**'
            database:
              - 'backend/database/**'
            factcheck:
              - 'backend/fact-check/**'
            scraper:
              - 'backend/scraper/**'
            analyzer:
              - 'backend/analyzer/**'
            political_bias:
              - 'backend/political_bias/**'
            bias_classifier_task:
              - 'backend/bias_classifier_task/**'
            application:
              - 'application/**'
            telebot:
              - 'telebot/**'

  unit-tests:
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        service:
          - path: backend/database
            name: database
            changed: ${{ needs.changes.outputs.database }}
          - path: backend/analyzer
            name: analyzer
            changed: ${{ needs.changes.outputs.analyzer }}
          - path: backend/political_bias
            name: political_bias
            changed: ${{ needs.changes.outputs.political_bias }}
          - path: backend/fact-check
            name: fact-check
            changed: ${{ needs.changes.outputs.factcheck }}
          - path: backend/sentiment
            name: sentiment
            changed: ${{ needs.changes.outputs.sentiment }}
            slow: true
          - path: backend/emotion
            name: emotion
            changed: ${{ needs.changes.outputs.emotion }}
            slow: true
          - path: backend/propaganda
            name: propaganda
            changed: ${{ needs.changes.outputs.propaganda }}
            slow: true
          - path: backend/scraper
            name: scraper
            changed: ${{ needs.changes.outputs.scraper }}
          - path: application
            name: application
            changed: ${{ needs.changes.outputs.application }}

    steps:
      - name: Skip if no changes
        if: matrix.service.changed != 'true'
        run: echo "No changes in ${{ matrix.service.name }}, skipping."

      - name: Checkout Code
        if: matrix.service.changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.service.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service.path }}/requirements.txt

      - name: Install dependencies for ${{ matrix.service.name }}
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-mock

      - name: Run tests for ${{ matrix.service.name }}
        if: matrix.service.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        env:
          PYTHONPATH: ${{ matrix.service.path }}
          API_KEY: ${{ secrets.API_KEY }}
          API_KEYDS: ${{ secrets.API_KEYDS }}
          MODEL: ${{ secrets.MODEL }}
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
          else
            echo "No tests directory found for ${{ matrix.service.name }}"
          fi

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: database
            context: ./backend/database
          - name: sentiment
            context: ./backend/sentiment
            slow: true
          - name: emotion
            context: ./backend/emotion
            slow: true
          - name: propaganda
            context: ./backend/propaganda
            slow: true
          - name: factcheck
            context: ./backend/fact-check
          - name: scraper
            context: ./backend/scraper
          - name: analyzer
            context: ./backend/analyzer
          - name: political-bias
            context: ./backend/political_bias
          - name: bias-classifier
            context: ./backend/bias_classifier_task
          - name: application
            context: ./application
          - name: telebot
            context: ./telebot

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if slow service needs build
        id: should-build
        run: |
          if [[ "${{ matrix.service.slow }}" != "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.service.name }}" == "sentiment" && "${{ needs.changes.outputs.sentiment }}" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.service.name }}" == "emotion" && "${{ needs.changes.outputs.emotion }}" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.service.name }}" == "propaganda" && "${{ needs.changes.outputs.propaganda }}" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.service.name }} - no changes detected"
          fi

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service.name }}
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: ${{ matrix.service.name }}:test
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
