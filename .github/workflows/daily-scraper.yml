name: Daily News Scraper

on:
  schedule:
    # Run daily at 12 AM UTC (8 AM Singapore time)
    - cron: '0 0 * * *'

  pull_request:
    branches: [main]
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Free up disk space
        run: |
          # Remove unnecessary software to free up ~30GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # Clean up Docker
          docker system prune -af --volumes
          # Show available space
          df -h
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create backend env file
        run: |
          mkdir -p backend
          cat << 'EOF' > backend/.env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          API_KEY=${{ secrets.API_KEY }}
          API_KEYDS=${{ secrets.API_KEYDS }}
          MODEL=${{ secrets.MODEL }}
          EOF
          cat << 'EOF' > .env
          TELEBOT_TOKEN=${{ secrets.TELEBOT_TOKEN }}
          APPLICATION_URL=http://application:8010
          WEB_APP_URL=http://localhost:5173
          TINYURL_API_TOKEN=${{ secrets.TINYURL_API_TOKEN }}
          EOF
      
      - name: Build and start services
        run: |
          # Only build scraper and political_bias services to save disk space
          docker compose up -d --build political_bias scraper
          # Wait for services to be ready
          sleep 15
      
      - name: Run daily scrape job
        run: |
          docker compose exec -T scraper curl -X POST http://localhost:8015/scrape \
            -H "Content-Type: application/json" \
            -d '{"article_limit": 100}' \
            --max-time 3600
      
      - name: Check scraper logs
        if: always()
        run: |
          docker compose logs scraper | tail -50
      
      - name: Stop services
        if: always()
        run: |
          docker compose down
      
      - name: Upload CSV to S3
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          pip install boto3
          python << 'EOF'
          import boto3
          import os
          from datetime import datetime
          
          s3 = boto3.client('s3',
            aws_access_key_id=os.getenv('AWS_ACCESS_KEY_ID'),
            aws_secret_access_key=os.getenv('AWS_SECRET_ACCESS_KEY'),
            region_name=os.getenv('AWS_REGION', 'us-east-1')
          )
          
          bucket = os.getenv('S3_BUCKET')
          csv_file = 'backend/scraper/data/scraped_articles.csv'
          
          if os.path.exists(csv_file):
            # Upload with timestamp backup
            timestamp = datetime.utcnow().strftime('%Y%m%d_%H%M%S')
            s3.upload_file(
              csv_file,
              bucket,
              'scraped_articles.csv',
              ExtraArgs={'ContentType': 'text/csv'}
            )
            s3.upload_file(
              csv_file,
              bucket,
              f'backups/scraped_articles_{timestamp}.csv',
              ExtraArgs={'ContentType': 'text/csv'}
            )
            print(f"✓ Uploaded to s3://{bucket}/scraped_articles.csv")
            print(f"✓ Backup: s3://{bucket}/backups/scraped_articles_{timestamp}.csv")
          else:
            print(f"❌ CSV file not found: {csv_file}")
            exit(1)
          EOF
        continue-on-error: true
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Daily scrape job failed"
          echo "Check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
