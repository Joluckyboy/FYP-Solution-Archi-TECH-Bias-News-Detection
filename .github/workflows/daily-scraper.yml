name: Daily Scraper
on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger
  pull_request:
    branches:
      - main
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increased from 40 to allow cleanup time

    env:
      # Core scraping settings
      SKIP_BIAS_CLASSIFICATION: "true" 
      
      # S3 upload settings
      S3_UPLOAD_ENABLED: "true"
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      # Database settings (for scraper to save articles)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cleanup disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af --volumes
          sudo apt-get clean
          echo 3 | sudo tee /proc/sys/vm/drop_caches
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create minimal env file for scraper
        run: |
          # Create .env ONLY with scraping-related variables
          cat << 'EOF' > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          API_KEY=${{ secrets.API_KEY }}
          SKIP_BIAS_CLASSIFICATION=true
          S3_UPLOAD_ENABLED=true
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          
          echo "Environment file created (scraping only, no telebot/tinyurl)"

      - name: Build scraper container
        run: |
          echo "Building scraper container..."
          docker compose build scraper
          echo "Memory after build:"
          free -h

      - name: Verify environment variables
        run: |
          echo "Checking critical environment variables..."
          echo "S3_BUCKET: ${S3_BUCKET:0:10}..."
          echo "AWS_REGION: $AWS_REGION"
          echo "SKIP_BIAS_CLASSIFICATION: $SKIP_BIAS_CLASSIFICATION"
          echo "S3_UPLOAD_ENABLED: $S3_UPLOAD_ENABLED"
          
          # Fail fast if AWS credentials missing
          if [ -z "$S3_BUCKET" ]; then
            echo "❌ ERROR: S3_BUCKET is not set!"
            exit 1
          fi
          
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "❌ ERROR: AWS_ACCESS_KEY_ID is not set!"
            exit 1
          fi
          
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ ERROR: AWS_SECRET_ACCESS_KEY is not set!"
            exit 1
          fi
          
          echo "All required environment variables are set"

      - name: Start scraper container
        run: |
          echo "Starting scraper container..."
          docker compose up -d scraper
          
          echo "Waiting for container to start..."
          sleep 10
          
          echo "Initial container logs:"
          docker compose logs scraper --tail 50

      - name: Wait for scraper API to be ready
        run: |
          echo "Waiting for scraper API to respond..."
          
          for i in {1..30}; do
            if curl -f http://localhost:8015/scraper/ > /dev/null 2>&1; then
              echo "Scraper API is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          # Final verification
          if ! curl -f http://localhost:8015/scraper/ > /dev/null 2>&1; then
            echo "❌ Scraper failed to start!"
            echo "Container logs:"
            docker compose logs scraper
            exit 1
          fi

      - name: Run scraping job
        timeout-minutes: 35
        run: |
          docker compose exec -T scraper python << 'PYEOF'
          import requests, sys, time
          
          print("=" * 60)
          print("=" * 60)
          print("Config: SKIP_BIAS_CLASSIFICATION=true")
          print("")
          
          # Start scraping job
          try:
              r = requests.post(
                  "http://localhost:8015/scraper/scrape-all-sources",
                  params={
                      "num_articles": 100,
                      "sg_only": "false",
                      "async_mode": "true"
                  },
                  timeout=30
              )
          except Exception as e:
              print(f"❌ Failed to connect to scraper: {e}")
              sys.exit(1)
          
          if r.status_code not in [200, 202]:
              print(f"❌ Failed to start job: HTTP {r.status_code}")
              print(f"Response: {r.text}")
              sys.exit(1)
          
          job_id = r.json().get("job_id")
          print(f"Scraping job started!")
          print(f"Job ID: {job_id}")
          print("")
          
          # Poll for completion
          for i in range(70):  # Max 35 minutes (70 * 30s)
              time.sleep(30)
              
              try:
                  status_response = requests.get(
                      f"http://localhost:8015/scraper/job-status/{job_id}",
                      timeout=10
                  )
                  s = status_response.json()
              except Exception as e:
                  print(f"⚠️  Error checking status: {e}")
                  continue
              
              status = s.get('status')
              articles = s.get('saved_articles', 0)
              progress = s.get('progress', 0)
              completed = s.get('completed_sources', 0)
              total = s.get('total_sources', 0)
              s3_status = s.get('s3_upload', {}).get('status', 'pending')
              
              elapsed = i * 30
              print(f"[{elapsed}s] Progress: {progress}% | Sources: {completed}/{total} | Articles: {articles} | S3: {s3_status}")
              
              if status == "completed":
                  print("")
                  print("=" * 60)
                  print("=" * 60)
                  print(f"Total articles scraped: {articles}")
                  
                  s3_upload = s.get('s3_upload', {})
                  if s3_upload.get('status') == 'success':
                      print("")
                      print("S3 UPLOAD SUCCESSFUL:")
                      print(f"  Main file: {s3_upload.get('main_url')}")
                      print(f"  Backup: {s3_upload.get('backup_url')}")
                      print("")
                      sys.exit(0)
                  else:
                      print("")
                      print(f"WARNING: S3 upload failed: {s3_upload.get('message')}")
                      print(f"Articles were scraped but not uploaded to S3")
                      print("")
                      sys.exit(1)  # Fail if S3 upload fails

              if status == "failed":
                  print("")
                  print("=" * 60)
                  print("SCRAPING FAILED")
                  print("=" * 60)
                  print(f"Error: {s.get('error')}")
                  print("")
                  sys.exit(1)
          
          print("")
          print("=" * 60)
          print("TIMEOUT: Job did not complete in 35 minutes")
          print("=" * 60)
          print(f"Last status: Progress {progress}%, {articles} articles scraped")
          print("")
          sys.exit(1)
          PYEOF

      - name: Cleanup old articles
        if: success()
        run: |
          echo ""
          echo "=" * 60
          echo "=" * 60
          echo ""
          
          docker compose exec -T scraper python << 'PYEOF'
          from utils.cleanup_old_articles import cleanup_old_articles
          
          print("Running cleanup to remove articles older than 7 days...")
          stats = cleanup_old_articles()
          
          print("")
          print("=" * 60)
          print(f"  Removed: {stats['removed']} old articles")
          print(f"  Kept: {stats['kept']} recent articles (last 7 days)")
          print(f"  Cutoff date: {stats['cutoff_date']}")
          print("")
          PYEOF

      - name: Upload cleaned dataset to S3
        if: success()
        run: |
          echo ""
          echo "Uploading cleaned dataset to S3..."
          echo ""
          
          docker compose exec -T scraper python << 'PYEOF'
          from utils.s3_uploader import S3Uploader
          from utils.csv_handler import CSVHandler
          
          s3 = S3Uploader()
          result = s3.upload_csv(CSVHandler.CSV_FILE, create_backup=True)
          
          if result.get('success'):
              print("Cleaned dataset uploaded to S3")
              print(f"  Main: {result.get('main_url')}")
              print(f"  Backup: {result.get('backup_url')}")
          else:
              print(f"Upload failed: {result.get('message')}")
              exit(1)
          PYEOF

      - name: Show final logs
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "Final Scraper Logs (last 100 lines)"
          echo "========================================="
          docker compose logs scraper --tail 100
          echo ""

      - name: Show resource usage
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "System Resource Usage"
          echo "========================================="
          free -h
          echo ""
          df -h
          echo ""

      - name: Cleanup containers
        if: always()
        run: |
          echo "Stopping containers..."
          docker compose down
          
          echo "Cleaning up Docker resources..."
          docker system prune -af
          
          echo "Final memory state:"
          free -h

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "DAILY SCRAPING WORKFLOW COMPLETE"
          echo "════════════════════════════════════════"
