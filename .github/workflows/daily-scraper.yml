name: Daily Scraper - Optimized

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger
  pull_request:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af --volumes
          sudo apt-get clean
          echo 3 | sudo tee /proc/sys/vm/drop_caches
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create env files
        run: |
          cat << 'EOF' > backend/.env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          API_KEY=${{ secrets.API_KEY }}
          EOF

      - name: Build ONLY scraper
        run: |
          docker compose build scraper
          echo "Memory after build:"
          free -h

      - name: Start scraper
        env:
          SKIP_BIAS_CLASSIFICATION: "true"
          S3_UPLOAD_ENABLED: "true"
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          docker compose up -d scraper
          sleep 10

      - name: Run scraping
        timeout-minutes: 25
        run: |
          docker compose exec -T scraper python << 'PYEOF'
          import requests, sys, time
          
          r = requests.post(
              "http://localhost:8015/scraper/scrape-all-sources",
              params={
                  "num_articles": 100,
                  "sg_only": "false",
                  "async_mode": "true"
              },
              timeout=30
          )
          
          if r.status_code not in [200, 202]:
              print(f"Failed: {r.status_code}")
              sys.exit(1)
          
          job_id = r.json().get("job_id")
          print(f"Job: {job_id}")
          
          for i in range(60):
              time.sleep(30)
              try:
                  s = requests.get(
                      f"http://localhost:8015/scraper/job-status/{job_id}",
                      timeout=10
                  ).json()
              except:
                  continue
              
              status = s.get('status')
              articles = s.get('saved_articles', 0)
              s3_status = s.get('s3_upload', {}).get('status', 'pending')
              
              print(f"[{i*30}s] Status: {status} | Articles: {articles} | S3: {s3_status}")
              
              if status == "completed":
                  s3_upload = s.get('s3_upload', {})
                  if s3_upload.get('status') == 'success':
                      print(f"✓ Complete! {articles} articles")
                      print(f"✓ S3 Main: {s3_upload.get('main_url')}")
                      print(f"✓ S3 Backup: {s3_upload.get('backup_url')}")
                  else:
                      print(f"⚠ Scraping done but S3 upload failed: {s3_upload.get('message')}")
                  sys.exit(0)
              
              if status == "failed":
                  print(f"❌ Failed: {s.get('error')}")
                  sys.exit(1)
          
          print("⏱ Timeout")
          sys.exit(1)
          PYEOF

      - name: Cleanup old articles
        run: |
          docker compose exec -T scraper python -c "
          from utils.cleanup_old_articles import cleanup_old_articles
          stats = cleanup_old_articles()
          print(f'Cleanup: {stats}')
          "

      - name: Show logs
        if: always()
        run: |
          echo "=== Scraper Logs ==="
          docker compose logs scraper --tail 50
          echo "=== Memory ==="
          free -h

      - name: Stop services
        if: always()
        run: |
          docker compose down
          docker system prune -af
          free -h